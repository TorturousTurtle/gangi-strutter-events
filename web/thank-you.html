<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration Received</title>
    <link rel="stylesheet" href="./assets/css/app.css" />
</head>

<body class="bg-white text-gray-900 min-h-screen flex flex-col">
    <div id="site-header"></div>

    <main class="flex-1 w-full px-4 py-6 sm:py-10">
        <div class="mx-auto w-full max-w-6xl">
            <div class="flex h-full items-start sm:items-center justify-center px-4 py-8 sm:py-16">
                <div class="w-full max-w-xl text-center">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">
                        Thank You
                    </h1>

                    <p id="thanksLine1" class="mt-4 text-sm sm:text-base text-gray-700">
                        Loading…
                    </p>

                    <p id="thanksLine2" class="mt-2 text-sm sm:text-base text-gray-700">
                    </p>

                    <!-- Optional: show registration id when API returns one -->
                    <p id="regIdLine" class="mt-3 hidden text-xs sm:text-sm text-gray-600"></p>

                    <!-- Limit button width so they don't span the whole page -->
                    <div class="mt-8 mx-auto flex flex-col sm:flex-row gap-3 justify-center" style="max-width: 28rem;">
                        <a href="./index.html"
                            class="inline-flex items-center justify-center rounded-lg bg-violet-600 px-5 py-2.5 text-sm font-medium text-white text-center hover:bg-violet-700"
                            style="width:auto;">
                            Back to Event Page
                        </a>
                    
                        <a href="./register.html"
                            class="inline-flex items-center justify-center rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 text-center"
                            style="width:auto;">
                            Register Another Athlete
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="./assets/js/layout.js"></script>
    <script src="./assets/js/header.js"></script>
    <script>
        const qs = new URLSearchParams(location.search);
        const paid = qs.get('paid');

        const line1 = document.getElementById('thanksLine1');
        const line2 = document.getElementById('thanksLine2');

        function showRegId(id) {
            const el = document.getElementById("regIdLine");
            if (!el) return;
            el.textContent = `Confirmation ID: ${id}`;
            el.classList.remove("hidden");
        }

        function safeJsonParse(s) {
            try { return JSON.parse(s); } catch { return null; }
        }

        async function finalizeRegistrationFromDraft() {
            const raw = localStorage.getItem('registrationDraft');
            const draft = raw ? safeJsonParse(raw) : null;

            if (!draft || typeof draft !== 'object') {
                line1.textContent = 'Payment completed, but we could not find your registration details.';
                line2.textContent = 'Please contact the event organizer for help.';
                return;
            }

            line1.textContent = 'Payment completed! Finalizing your registration…';
            line2.textContent = '';

            const fd = new FormData();
            Object.entries(draft).forEach(([k, v]) => {
                if (v === null || v === undefined) return;
                fd.append(k, String(v));
            });

            try {
                const res = await fetch('/api/register.php', { method: 'POST', body: fd });
                if (!res.ok) {
                    const text = await res.text();
                    console.error('Finalize error:', text);
                    line1.textContent = 'Payment completed, but we could not finalize your registration automatically.';
                    line2.textContent = 'Please contact the event organizer for help.';
                    return;
                }

                // Expect JSON: { ok: true, id: <number> } (or { id: <number> })
                const data = await res.json().catch(() => null);
                const id = data?.id || data?.registration_id || data?.registrationId;

                line1.textContent = 'Your registration has been recorded successfully.';
                line2.textContent = 'You’re all set — see you at the competition!';

                if (id) {
                    sessionStorage.setItem('registration_id', String(id));
                    showRegId(String(id));
                }

                // Clear the draft so refreshing this page doesn't double-submit.
                localStorage.removeItem('registrationDraft');
            } catch (e) {
                console.error(e);
                line1.textContent = 'Payment completed, but we could not finalize your registration automatically.';
                line2.textContent = 'Please contact the event organizer for help.';
            }
        }

        (function init() {
            // If we already have an ID, always show it.
            const existingId = sessionStorage.getItem('registration_id');
            if (existingId) showRegId(existingId);

            if (paid === '1') {
                // Stub flow: this is where we create the DB record.
                finalizeRegistrationFromDraft();
                return;
            }

            // Not paid (arrived here directly): show a neutral message.
            line1.textContent = 'Your registration is not complete yet.';
            line2.textContent = 'Please return to the payment step to finish.';
        })();
    </script>
</body>

</html>
