<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registration Received</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="./assets/css/app.css" />
    <link rel="stylesheet" href="./assets/css/design-tokens.css" />
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/components.css" />
    <link rel="stylesheet" href="./assets/css/custom.css" />
    <!-- Branding (loads dynamic theme from admin settings) -->
    <script src="./assets/js/branding-loader.js"></script>
    <style>
        .success-page {
            min-height: calc(100vh - 72px - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8, 2rem) var(--space-4, 1rem);
        }

        .success-card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: white;
            border: 1px solid var(--neutral-200, #e4e4e7);
            border-radius: var(--radius-xl, 16px);
            padding: var(--space-8, 2rem);
            box-shadow: var(--shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1));
        }

        .success-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-4, 1rem);
            background: linear-gradient(135deg, var(--color-success-light, #dcfce7), var(--color-success, #16a34a));
            border-radius: var(--radius-full, 9999px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-icon svg {
            width: 32px;
            height: 32px;
            color: var(--color-success-dark, #166534);
        }

        .success-icon.pending {
            background: linear-gradient(135deg, var(--color-warning-light, #fef9c3), var(--color-warning, #ca8a04));
        }

        .success-icon.pending svg {
            color: var(--color-warning-dark, #854d0e);
        }

        .success-title {
            font-size: var(--text-2xl, 1.5rem);
            font-weight: var(--font-bold, 700);
            color: var(--neutral-900, #18181b);
            margin-bottom: var(--space-2, 0.5rem);
        }

        .success-message {
            font-size: var(--text-sm, 0.875rem);
            color: var(--neutral-600, #52525b);
            line-height: 1.6;
            margin-bottom: var(--space-2, 0.5rem);
        }

        .success-id {
            display: inline-block;
            padding: var(--space-2, 0.5rem) var(--space-4, 1rem);
            background: var(--neutral-100, #f4f4f5);
            border-radius: var(--radius-lg, 12px);
            font-size: var(--text-xs, 0.75rem);
            color: var(--neutral-600, #52525b);
            margin-top: var(--space-4, 1rem);
        }

        .success-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-3, 0.75rem);
            margin-top: var(--space-6, 1.5rem);
        }

        @media (min-width: 480px) {
            .success-actions {
                flex-direction: row;
                justify-content: center;
            }
        }

        .success-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2, 0.5rem);
            padding: var(--space-3, 0.75rem) var(--space-5, 1.25rem);
            font-size: var(--text-sm, 0.875rem);
            font-weight: var(--font-semibold, 600);
            border-radius: var(--radius-lg, 12px);
            text-decoration: none;
            transition: all 150ms ease;
        }

        .success-btn-primary {
            background: var(--brand-primary, #6366f1);
            color: white;
        }

        .success-btn-primary:hover {
            background: var(--brand-primary-hover, #4f46e5);
        }

        .success-btn-secondary {
            background: white;
            color: var(--neutral-700, #3f3f46);
            border: 1px solid var(--neutral-300, #d4d4d8);
        }

        .success-btn-secondary:hover {
            background: var(--neutral-50, #fafafa);
        }

        .success-btn svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

<body style="background: var(--neutral-50, #fafafa);">
    <div id="site-header"></div>

    <!-- Progress Header -->
    <div class="page-header" style="background: linear-gradient(135deg, var(--brand-primary, #6366f1) 0%, var(--brand-primary-hover, #4f46e5) 100%); color: white; padding: var(--space-4, 1rem);">
        <div style="max-width: 640px; margin: 0 auto;">
            <!-- Progress Stepper -->
            <div class="progress-stepper" style="margin-top: 0; padding: var(--space-2, 0.5rem) 0;">
                <div class="progress-step completed">
                    <span class="progress-step-number">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    <span class="progress-step-label">Register</span>
                </div>
                <div class="progress-connector completed"></div>
                <div class="progress-step completed">
                    <span class="progress-step-number">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </span>
                    <span class="progress-step-label">Review & Pay</span>
                </div>
                <div class="progress-connector completed"></div>
                <div class="progress-step active">
                    <span class="progress-step-number">3</span>
                    <span class="progress-step-label">Confirmation</span>
                </div>
            </div>
        </div>
    </div>

    <main class="success-page">
        <div class="success-card">
            <div class="success-icon" id="statusIcon">
                <i data-lucide="check" id="iconCheck"></i>
                <i data-lucide="clock" id="iconClock" class="hidden"></i>
            </div>

            <h1 class="success-title" id="successTitle">Thank You!</h1>

            <p id="thanksLine1" class="success-message">
                Loading…
            </p>

            <p id="thanksLine2" class="success-message">
            </p>

            <div id="regIdLine" class="success-id hidden"></div>

            <div class="success-actions">
                <a href="./index.html" class="success-btn success-btn-primary">
                    <i data-lucide="home"></i>
                    <span>Back to Home</span>
                </a>

                <a href="./register.html" class="success-btn success-btn-secondary">
                    <i data-lucide="plus"></i>
                    <span>Register Another</span>
                </a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="./assets/js/lib/api.js"></script>
    <script src="./assets/js/branding.js"></script>
    <script src="./assets/js/layout.js"></script>
    <script src="./assets/js/header.js"></script>
    <script>
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }

        const qs = new URLSearchParams(location.search);
        const paid = qs.get('paid');
        const payLater = qs.get('pay_later');

        const line1 = document.getElementById('thanksLine1');
        const line2 = document.getElementById('thanksLine2');
        const statusIcon = document.getElementById('statusIcon');
        const iconCheck = document.getElementById('iconCheck');
        const iconClock = document.getElementById('iconClock');
        const successTitle = document.getElementById('successTitle');

        function showRegId(id) {
            const el = document.getElementById("regIdLine");
            if (!el) return;
            el.textContent = `Confirmation ID: ${id}`;
            el.classList.remove("hidden");
        }

        function showPending() {
            statusIcon?.classList.add('pending');
            iconCheck?.classList.add('hidden');
            iconClock?.classList.remove('hidden');
        }

        function safeJsonParse(s) {
            try { return JSON.parse(s); } catch { return null; }
        }

        function loadDraftFromStorage() {
            const keys = ['registrationDraft', 'registration', 'draftRegistration'];
            for (const k of keys) {
                const raw = localStorage.getItem(k);
                const parsed = raw ? safeJsonParse(raw) : null;
                if (parsed && typeof parsed === 'object') {
                    return { key: k, draft: parsed };
                }
            }
            return { key: null, draft: null };
        }

        async function finalizeRegistrationFromDraft() {
            const loaded = loadDraftFromStorage();
            const draft = loaded.draft;

            if (!draft || typeof draft !== 'object') {
                line1.textContent = 'Payment completed, but we could not find your registration details.';
                line2.textContent = 'Please contact the event organizer for help.';
                return;
            }

            line1.textContent = 'Payment completed! Finalizing your registration…';
            line2.textContent = '';

            const fd = new FormData();
            Object.entries(draft).forEach(([k, v]) => {
                if (v === null || v === undefined) return;
                fd.append(k, String(v));
            });

            if (!fd.has('applyFacilityFee')) {
                const ffa = draft?.facilityFeeApplied;
                if (ffa !== undefined && ffa !== null) {
                    fd.append('applyFacilityFee', Number(ffa) > 0 ? '1' : '0');
                }
            }

            try {
                const res = await fetch('/api/register.php', { method: 'POST', body: fd });
                if (!res.ok) {
                    const text = await res.text();
                    console.error('Finalize error:', text);
                    line1.textContent = 'Payment completed, but we could not finalize your registration automatically.';
                    line2.textContent = 'Please contact the event organizer for help.';
                    return;
                }

                const data = await res.json().catch(() => null);
                const id = data?.id || data?.registration_id || data?.registrationId;

                line1.textContent = 'Your registration has been recorded successfully.';
                line2.textContent = 'You're all set — see you at the competition!';

                if (id) {
                    sessionStorage.setItem('registration_id', String(id));
                    showRegId(String(id));
                }

                const usedKey = loaded?.key || 'registrationDraft';
                localStorage.removeItem(usedKey);
                if (usedKey !== 'registrationDraft') localStorage.removeItem('registrationDraft');
                if (usedKey !== 'registration') localStorage.removeItem('registration');
            } catch (e) {
                console.error(e);
                line1.textContent = 'Payment completed, but we could not finalize your registration automatically.';
                line2.textContent = 'Please contact the event organizer for help.';
            }
        }

        (function init() {
            const existingId = sessionStorage.getItem('registration_id');
            if (existingId) showRegId(existingId);

            if (payLater === '1') {
                // Pay Later flow
                successTitle.textContent = 'Registration Received';
                showPending();
                line1.textContent = 'Your registration has been submitted.';
                line2.textContent = 'Payment is pending. Please contact the organizer to arrange payment.';

                // Clear the draft
                const loaded = loadDraftFromStorage();
                if (loaded.key) {
                    localStorage.removeItem(loaded.key);
                }
                return;
            }

            if (paid === '1') {
                finalizeRegistrationFromDraft();
                return;
            }

            // Not paid (arrived here directly)
            showPending();
            successTitle.textContent = 'Registration Incomplete';
            line1.textContent = 'Your registration is not complete yet.';
            line2.textContent = 'Please return to the payment step to finish.';
        })();
    </script>
</body>

</html>
